<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBG Data Entry</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: the CBG Operations Dashboard skin (Profit Isle style): white app bar, icon rail of departments, black page band with breadcrumb, tabs and controls, flat 4px cards and dense zebra tables */
:root{
  --pi-bg:#f4f4f5;--pi-surface:#fff;--pi-ink:#111;--pi-muted:#6b6b72;--pi-line:#e4e4e7;--pi-z1:#fafafa;--pi-z2:#efeff1;--pi-band:#0b0b0c;--pi-band-2:#2a2a2e;--pi-accent:#22c55e;
  --navy:#01427A;--navy-2:#0B5CA8;--good:#1E8449;--bad:#C0392B;--amber:#E0A21B;--good-t:#1E8449;--bad-t:#C0392B;
  --btn-bg:#0b0b0c;--btn-ink:#fff;--hover:#e6f7ec;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--rail:52px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pi-bg:#0d0d0f;--pi-surface:#17171a;--pi-ink:#ececf0;--pi-muted:#9a9aa3;--pi-line:#2a2a30;--pi-z1:#17171a;--pi-z2:#1e1e22;--pi-band:#000;--pi-band-2:#26262b;
  --navy:#5B9BE0;--navy-2:#8DBDF0;--good:#58C98A;--bad:#EF7A6B;--amber:#F2B83A;--good-t:#58C98A;--bad-t:#EF7A6B;--btn-bg:#fff;--btn-ink:#000;--hover:#123321;color-scheme:dark}}
:root[data-theme="dark"]{
  --pi-bg:#0d0d0f;--pi-surface:#17171a;--pi-ink:#ececf0;--pi-muted:#9a9aa3;--pi-line:#2a2a30;--pi-z1:#17171a;--pi-z2:#1e1e22;--pi-band:#000;--pi-band-2:#26262b;
  --navy:#5B9BE0;--navy-2:#8DBDF0;--good:#58C98A;--bad:#EF7A6B;--amber:#F2B83A;--good-t:#58C98A;--bad-t:#EF7A6B;--btn-bg:#fff;--btn-ink:#000;--hover:#123321;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--pi-bg);color:var(--pi-ink)}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding-left:var(--rail);overflow-x:clip}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit}

/* app bar */
.hdr{position:sticky;top:0;z-index:30;background:var(--pi-surface);border-bottom:1px solid var(--pi-line);padding-top:env(safe-area-inset-top,0px)}
.nav{height:48px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;text-decoration:none}
.logo{height:26px;width:auto;flex:none}
:root[data-theme="dark"] .logo{background:#fff;border-radius:5px;padding:2px 4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#fff;border-radius:5px;padding:2px 4px}}
.nt{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--pi-ink);white-space:nowrap}
.nt b{font-weight:600;color:var(--pi-muted);margin-left:8px;letter-spacing:.06em}
.navb{display:flex;align-items:center;gap:6px;flex-shrink:0}
.thbtn{width:30px;height:30px;border-radius:6px;border:0;background:transparent;color:var(--pi-ink);display:grid;place-items:center;cursor:pointer}
.thbtn:hover{background:var(--pi-z2)}
.thbtn svg{width:17px;height:17px}
.thbtn .i-sun{display:none}
:root[data-theme="dark"] .thbtn .i-sun{display:block}:root[data-theme="dark"] .thbtn .i-moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .thbtn .i-sun{display:block}:root:not([data-theme="light"]) .thbtn .i-moon{display:none}}
.obtn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:6px;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--pi-line);font:600 12.5px/1 var(--sans);color:var(--pi-ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.obtn:hover{background:var(--pi-z2)}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px;border-radius:6px;border:0;background:var(--btn-bg);color:var(--btn-ink);font:600 12.5px/1 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.pbtn:hover{opacity:.88}
.pbtn[disabled]{opacity:.55;cursor:progress}
.qn{background:var(--amber);color:#2b1d00;font-size:10px;letter-spacing:.04em;padding:3px 6px;border-radius:4px}
.pi-me{width:30px;height:30px;border-radius:50%;background:var(--pi-z2);display:grid;place-items:center;font:600 11px/1 var(--sans);color:var(--pi-ink);margin-left:4px;flex:none}

/* icon rail: one button per department form */
#rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:40;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:58px 8px 52px;background:var(--pi-surface);border-right:1px solid var(--pi-line);transition:width .2s;overflow:hidden}
#rail a{display:flex;align-items:center;gap:10px;height:36px;padding:0 9px;border-radius:6px;color:var(--pi-ink);font:600 12.5px/1 var(--sans);white-space:nowrap;overflow:hidden;text-decoration:none}
#rail a svg{flex:none;width:18px;height:18px}
#rail a .lbl{opacity:0;transition:opacity .15s}
#rail a:hover{background:var(--pi-z2)}
#rail a[aria-current="page"]{background:var(--pi-accent);color:#fff}
#rail .div{height:1px;background:var(--pi-line);margin:4px 2px}
.rail-tog{position:fixed;left:0;bottom:0;width:var(--rail);height:44px;z-index:41;border:0;border-right:1px solid var(--pi-line);border-top:1px solid var(--pi-line);background:var(--pi-surface);color:var(--pi-ink);cursor:pointer;display:grid;place-items:center;transition:width .2s}
.rail-tog svg{width:16px;height:16px;transition:transform .2s}
body.rail-open #rail,body.rail-open .rail-tog{width:236px}
body.rail-open #rail a .lbl{opacity:1}
body.rail-open .rail-tog svg{transform:rotate(180deg)}
body.rail-open #rail{box-shadow:12px 0 30px rgba(0,0,0,.12)}

/* black page band */
.hero{background:var(--pi-band);color:#fff;padding-block:14px 12px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.eyebrow{margin:0;font:700 15px/1.3 var(--sans);color:#fff}
.eyebrow a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.eyebrow .sep{display:inline-block;margin:0 7px;color:#9a9aa3;font-weight:400}
.pmeta{margin:2px 0 0;font:400 12.5px/1.4 var(--sans);color:#c9c9cf}
.dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:#6b6b72;vertical-align:middle;margin:0 9px}
.upd{margin:2px 0 0;font-size:11.5px;color:#8d8d95}
.fresh{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fb{display:inline-flex;align-items:center;gap:6px;background:var(--pi-band-2);color:#d9d9de;border-radius:4px;font-size:11px;font-weight:500;padding:3px 7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fb i{flex:none;width:7px;height:7px;border-radius:50%;background:#22c55e}
.fb.demo i{background:var(--amber)}
.fb em{font-style:normal;color:#9a9aa3}
#tabs{display:flex;gap:2px;flex-wrap:wrap;padding:10px 0 0}
#tabs a{color:#c9c9cf;border-radius:4px;padding:6px 10px;font:500 12.5px/1 var(--sans);text-decoration:none;white-space:nowrap}
#tabs a:hover{background:var(--pi-band-2);color:#fff}
#tabs a[aria-current="page"]{background:#fff;color:#000;font-weight:600}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.bar .note{color:#9a9aa3;font-size:11.5px;flex-basis:100%}
.msb{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 12px;border-radius:4px;background:#fff;color:#111;font:600 12.5px/30px var(--sans)}
.msb .msk{color:#6b6b72;font-weight:500}
.msb input{border:0;background:transparent;color:#111;font:600 12.5px/1 var(--sans);height:28px;width:170px;padding:0 6px;outline:none}
.msb input::placeholder{color:#9a9aa3;font-weight:500}
.msb select{border:0;background:transparent;color:#111;font:600 12.5px/1 var(--sans);height:28px;max-width:260px;cursor:pointer}
.hseg{display:inline-flex;background:var(--pi-band-2);border-radius:5px;padding:2px}
.hseg span{color:#e4e4e7;border-radius:4px;font:600 12px/1 var(--sans);padding:7px 10px}
.hseg span.on{background:#fff;color:#000}

/* content */
main{padding-block:14px 110px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:start}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s4{grid-column:span 4}
.sec{font:700 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--pi-muted);display:flex;align-items:center;gap:14px;margin:12px 0 8px}
.sec::after{content:"";flex:1;height:1px;background:var(--pi-line)}
.sec:first-child{margin-top:4px}
.trow{display:flex;flex-wrap:wrap;gap:10px}
.trow>.tile{flex:1 1 calc(25% - 10px);min-width:0}
.tile,.panel{background:var(--pi-surface);border:1px solid var(--pi-line);border-radius:4px;min-width:0}
.tile{position:relative;padding:12px 14px}
.tile.good::after,.tile.warn::after,.tile.bad::after{display:grid;place-items:center;position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;font:700 12px/1 var(--sans);color:#fff}
.tile.good::after{content:"✓";background:#16a34a}
.tile.warn::after{content:"!";background:#d97706}
.tile.bad::after{content:"✕";background:#dc2626;font-size:11px}
.tile.good,.tile.warn,.tile.bad{padding-right:42px}
.tl{font:600 12.5px/1.3 var(--sans);color:var(--pi-ink)}
.tf{font-size:11.5px;color:var(--pi-muted);line-height:1.35;margin-top:1px}
.tv{font:700 26px/1.1 var(--sans);letter-spacing:-.01em;margin:8px 0 6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv small{font-size:14px;color:var(--pi-muted);font-weight:500;margin-left:3px}
.ts{font-size:11.5px;color:var(--pi-muted);line-height:1.4}
.ts.good{color:var(--good-t)}.ts.bad{color:var(--bad-t)}
.panel{padding:12px 14px}
.panel h2{font:700 13px/1.3 var(--sans);margin:0;color:var(--pi-ink)}
.panel .hint{font-size:11.5px;color:var(--pi-muted);margin:2px 0 10px}
.pill{display:inline-block;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:600}
.pill.g{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-t)}
.pill.b{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad-t)}
.pill.a{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--pi-ink)}
.pill.n{background:color-mix(in srgb,var(--navy) 14%,transparent);color:var(--navy)}

/* forms list (home) */
.btbl{overflow:auto}
.btbl table{width:100%;border-collapse:collapse;font:400 12.5px/1.3 var(--sans);font-variant-numeric:tabular-nums}
.btbl th{position:sticky;top:0;background:var(--pi-surface);color:var(--pi-ink);font-weight:700;font-size:12px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--pi-line);white-space:nowrap}
.btbl th.r,.btbl td.r{text-align:right}
.btbl td{padding:8px 10px;white-space:nowrap;vertical-align:top}
.btbl td.wrap{white-space:normal;min-width:220px;color:var(--pi-muted)}
.btbl tbody tr:nth-child(odd) td{background:var(--pi-z1)}
.btbl tbody tr:nth-child(even) td{background:var(--pi-z2)}
.btbl tbody tr.link{cursor:pointer}
.btbl tbody tr.link:hover td{background:var(--hover)}
.btbl tr.grp td{background:var(--pi-surface);font-weight:700;border-top:1px solid var(--pi-line);padding:10px}
.btbl tr.grp td::before{content:"›";display:inline-block;margin-right:8px;font-weight:700}
.btbl a{font-weight:600;text-decoration:none}
.btbl a:hover{text-decoration:underline}
.ico{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--pi-z2);vertical-align:middle;margin-right:8px}
.ico svg{width:15px;height:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px;margin-top:6px;white-space:normal}
.kv dt{color:var(--pi-muted)} .kv dd{margin:0}
details summary{cursor:pointer;font-weight:600}

/* form fields */
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label,.fld legend{font:600 12.5px/1.3 var(--sans);color:var(--pi-ink);padding:0}
.req{color:var(--bad-t);margin-left:2px}
.fhint{font-size:11.5px;color:var(--pi-muted)}
.fld input,.fld select,.fld textarea{width:100%;min-height:40px;background:var(--pi-surface);border:1px solid var(--pi-line);border-radius:4px;padding:8px 11px;font:400 15px/1.3 var(--sans);color:var(--pi-ink)}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pi-ink);outline:none;box-shadow:0 0 0 1px var(--pi-ink)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--bad-t);box-shadow:0 0 0 1px var(--bad-t)}
.fld .msg{font-size:11.5px;color:var(--bad-t);font-weight:600}
fieldset.fld{border:0;margin:0;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--pi-z2);border-radius:5px;padding:2px}
.seg label{flex:1 1 auto;position:relative;min-width:64px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:flex;align-items:center;justify-content:center;min-height:36px;padding:6px 12px;border-radius:4px;font:600 12.5px/1.2 var(--sans);color:var(--pi-ink);cursor:pointer;text-align:center}
.seg span:hover{background:var(--pi-line)}
.seg input:checked+span{background:var(--btn-bg);color:var(--btn-ink)}
.seg input:focus-visible+span{outline:2px solid var(--navy);outline-offset:1px}
.fld.bad .seg{box-shadow:0 0 0 1px var(--bad-t)}
.sev-High input:checked+span,.sev-Critical input:checked+span{background:#dc2626;color:#fff}
.rule{grid-column:1/-1;border:1px solid var(--pi-line);border-left:4px solid #dc2626;border-radius:4px;padding:10px 12px;font-weight:600;color:var(--bad-t);background:color-mix(in srgb,var(--bad) 8%,var(--pi-surface))}
.err{border:1px solid var(--pi-line);border-left:4px solid #dc2626;border-radius:4px;padding:10px 12px;margin-bottom:12px;background:var(--pi-surface);font-weight:600}
.kpis{display:flex;flex-direction:column;gap:10px}
.side-list{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--pi-muted);display:flex;flex-direction:column;gap:7px}
.side-list b{color:var(--pi-ink);font-weight:600}
.stick{position:sticky;top:62px}

/* sections and table-style questions (brew sheet) */
.fsec{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-bottom:2px solid var(--pi-ink);padding:14px 0 5px;scroll-margin-top:70px}
.fsec:first-child{padding-top:2px}
.fsec h3{margin:0;font:700 12.5px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase}
.fsec span{font-size:11.5px;color:var(--pi-muted)}
.glbl{font:600 12.5px/1.3 var(--sans)}
.gwrap{overflow-x:auto;border:1px solid var(--pi-line);border-radius:4px}
table.gt{border-collapse:collapse;width:100%;font:400 12.5px/1.3 var(--sans)}
table.gt thead th{background:var(--pi-surface);font-weight:700;font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--pi-line);white-space:nowrap}
table.gt tbody th{text-align:left;font-weight:600;padding:6px 8px;white-space:nowrap;vertical-align:middle}
table.gt tbody th small{display:block;font-weight:400;color:var(--pi-muted);font-size:11px}
table.gt td{padding:4px 6px;vertical-align:middle}
table.gt tbody tr:nth-child(odd)>*{background:var(--pi-z1)}
table.gt tbody tr:nth-child(even)>*{background:var(--pi-z2)}
table.gt input,table.gt select{width:100%;min-width:76px;height:34px;border:1px solid var(--pi-line);border-radius:3px;background:var(--pi-surface);color:var(--pi-ink);padding:4px 7px;font:400 14px/1 var(--sans)}
table.gt td.t-time input{min-width:104px}
table.gt td.t-text input{min-width:110px}
table.gt td.t-check{text-align:center}
table.gt input[type="checkbox"]{width:20px;height:20px;min-width:0;accent-color:var(--pi-ink);vertical-align:middle}
table.gt input:focus,table.gt select:focus{outline:none;border-color:var(--pi-ink);box-shadow:0 0 0 1px var(--pi-ink)}

/* brew sheet layout: boxes in rows like the paper sheet */
.sheetform{display:block}
.fsec .sn{font:700 12.5px/1.3 var(--sans);color:var(--pi-muted)}
.fsec .sr{margin-left:auto}
.snl{font-size:12px;color:var(--pi-muted);margin:6px 0 0}
.sgrid{display:grid;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));gap:12px 12px;margin:10px 0 4px;align-items:start}
.sgrid>.gridf{grid-column:1/-1}
.sf{gap:4px}
.sfh{display:flex;align-items:center;gap:6px;min-height:18px}
.sfh label{font:600 12.5px/1.2 var(--sans);color:var(--pi-ink)}
.cchip{flex:none;font:600 10.5px/1 ui-monospace,Menlo,Consolas,monospace;background:var(--pi-ink);color:var(--pi-surface);padding:3px 5px;border-radius:3px}
.sstd{margin-left:auto;font-size:11.5px;color:var(--pi-muted);white-space:nowrap}
.ub{position:relative;display:block}
.ub em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--pi-muted);pointer-events:none}
.ub input{padding-right:54px}
.ub input::-webkit-inner-spin-button{display:none}
.ssub{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--pi-muted)}
.sbx{display:inline-flex;align-items:center;gap:5px}
.sbx em{font-style:normal}
.fld .sbx input{width:70px;min-height:0;height:30px;font-size:13px;padding:3px 6px}
.fld .sbx input[type="time"]{width:104px}
.fld .sbx input[type="text"]{width:80px}
.snote{font-size:11.5px;color:var(--pi-muted)}
.seg.sm span{min-height:30px;padding:4px 8px;font-size:12px}
.seg.sm label{min-width:0}
.fld .seg input[type="radio"]{position:absolute;opacity:0;width:1px;height:1px;min-height:0;padding:0;border:0}
.sbx .seg.sm{background:var(--pi-z2)}

/* save bar */
.savebar{position:fixed;left:var(--rail);right:0;bottom:0;z-index:25;background:var(--pi-surface);border-top:1px solid var(--pi-line);padding-top:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .in{display:flex;gap:8px;align-items:center}
.savebar .sbtxt{font-size:12px;color:var(--pi-muted);margin-right:auto}
.savebar .pbtn,.savebar .obtn{height:40px;padding:0 18px;font-size:13.5px}
.savebar .pbtn{min-width:200px}

/* confirmation */
.done{max-width:640px;margin:24px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 22px}
.done .tick{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#16a34a;color:#fff;font:700 20px/1 var(--sans)}
.done.q .tick{background:#d97706}
.done h2{font:700 20px/1.2 var(--sans);margin:0}
.done p{color:var(--pi-muted);margin:0}
.rid{font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;background:var(--pi-z2);border-radius:4px;padding:6px 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.empty{background:var(--pi-surface);border:1px solid var(--pi-line);border-radius:4px;padding:34px 24px;text-align:center;color:var(--pi-muted)}

@media (max-width:1100px){.s8,.s4{grid-column:span 12}.stick{position:static}.kpis{flex-direction:row;flex-wrap:wrap}.kpis .tile{flex:1 1 150px}.trow>.tile{flex-basis:calc(50% - 10px)}}
@media (max-width:640px){
  :root{--rail:0px}
  #rail{top:auto;bottom:0;height:56px;width:100%!important;flex-direction:row;padding:8px;border-right:0;border-top:1px solid var(--pi-line);justify-content:space-around;gap:2px}
  #rail a{flex:1;justify-content:center;padding:0}#rail a .lbl{display:none}#rail .div{display:none}.rail-tog{display:none}
  .nav{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:8px}.nt b{display:none}.obtn .lbl{display:none}
  .savebar{bottom:56px}.savebar .sbtxt{display:none}.savebar .pbtn{flex:1;min-width:0}
  main{padding-bottom:140px}
  form{grid-template-columns:1fr}
  .msb input{width:130px}
  .sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sf[data-span]{grid-column:1/-1!important}
  .btbl td.wrap{min-width:160px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* simpler home: form cards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.fcard{display:flex;align-items:flex-start;gap:10px;padding:14px;background:var(--pi-surface);border:1px solid var(--pi-line);border-radius:4px;color:var(--pi-ink);text-decoration:none;min-width:0}
.fcard:hover{border-color:var(--pi-ink)}
.fcard .ico{flex:none;width:32px;height:32px;margin:0}.fcard .ico svg{width:17px;height:17px}
.fc-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.fc-d{font:600 11px/1.3 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--pi-muted)}
.fc-txt b{font:700 14px/1.3 var(--sans)}
.fc-s{font-size:12px;line-height:1.4;color:var(--pi-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard .pill{flex:none}
.fb.warn i{background:#d97706}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}#tabs{display:none}}
/* waiting to send: edit / delete */
.qhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--pi-line)}
.qlist .ico{flex:none;margin:0}
.qtxt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;font-size:12px;color:var(--pi-muted)}
.qtxt b{font:700 13px/1.3 var(--sans);color:var(--pi-ink)}
.qbtns{display:flex;gap:6px;flex:none}
.obtn.qdel.armed{background:var(--bad);color:#fff;box-shadow:none}
a.tlink{color:inherit;text-decoration:none}a.tlink:hover{border-color:var(--pi-ink)}
.editnote{background:color-mix(in srgb,var(--amber) 18%,transparent);border-radius:4px;padding:10px 12px;margin-bottom:10px;font-size:12.5px}
@media (max-width:640px){.qlist li{flex-wrap:wrap}.qbtns{width:100%;padding-left:34px}}

<script>
"use strict";
const FORMS = window.CBG_FORMS || [];
/* every form gets .all = its answerable fields in order; grid tables expand into one field per cell */
FORMS.forEach(f => {
  f.all = [];
  f.fields.forEach(x => {
    if (x.type === "section") return;
    if (x.type === "grid") x.rows.forEach(r => x.cols.forEach(c => f.all.push({ name: x.fmt.replace("{row}", r.name).replace("{col}", c.name), type: c.type, options: c.options || null, req: false, hint: "", grid: x.name, neg: !!c.neg })));
    else { f.all.push(x); (x.sub || []).forEach(sb => f.all.push(Object.assign({ req: false, hint: "" }, sb))); }
  });
});
if (!FORMS.length) document.addEventListener("DOMContentLoaded", () => { document.getElementById("app").innerHTML = "<div class=\"empty\">The form definitions are missing from this file.</div>"; });
const CFG = Object.assign({ mode: "demo", forms: {} }, window.CBG_CONFIG || {});
const MSAL_URL = "https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js";
const GRAPH = "https://graph.microsoft.com/v1.0";
const SCOPES = ["Files.ReadWrite.All", "Sites.Read.All"];
const NAME_FIELDS = /(Name|By|Supervisor|Started by)/;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- storage (works without localStorage) ---------- */
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, el = document) => el.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const stamp = d => `${isoDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

/* ---------- defaults & rules ---------- */
function defaults(form) {
  const now = new Date(), v = {};
  const hr = now.getHours();
  for (const f of form.all) {
    if (f.type === "date") {
      if (f.name === "Week Starting") { const d = new Date(now); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) - 7); v[f.name] = isoDate(d); }
      else v[f.name] = form.target && !f.req ? "" : isoDate(now);  /* newer sheets: only the main date starts as today */
    } else if (f.type === "time") v[f.name] = form.key === "hse" ? `${pad(hr)}:${pad(now.getMinutes())}` : "";
    else if (f.name === "Shift") v[f.name] = hr >= 6 && hr < 14 ? "Day" : hr >= 14 && hr < 22 ? "Evening" : "Night";
    else if (f.name === "Month") v[f.name] = MONTHS[now.getMonth()];
    else if (f.name === "Week") v[f.name] = "W" + Math.min(5, Math.ceil(now.getDate() / 7));
    else if (f.name === "Planned Time (min)") v[f.name] = "480";
    else if (false) v[f.name] = "";
    else if (f.type === "text" && NAME_FIELDS.test(f.name) && !/No\./.test(f.name)) v[f.name] = store.get("cbg.name", "");
    else v[f.name] = "";
  }
  return v;
}
function rules(key, v) {
  const r = { hide: new Set(), force: {}, exclude: {}, req: {}, note: null };
  if (key === "packaging") {
    const dt = parseFloat(v["Downtime (min)"]);
    if (!(dt > 0)) { r.hide.add("Main Downtime Cause"); r.hide.add("Downtime Notes"); r.force["Main Downtime Cause"] = "None"; }
    else { r.exclude["Main Downtime Cause"] = ["None"]; r.req["Main Downtime Cause"] = true; }
  }
  if (key === "qa") {
    if (v["Record Type"] === "Customer Complaint") {
      ["Parameter Tested", "Result Value", "Within Spec"].forEach(n => r.hide.add(n));
      r.force["Parameter Tested"] = "Other"; r.force["Within Spec"] = "No"; r.force["Result Value"] = "";
      r.exclude["Complaint Category"] = ["Not a complaint"];
    } else { r.hide.add("Complaint Category"); r.force["Complaint Category"] = "Not a complaint"; }
  }
  if (key === "hse" && ["High", "Critical"].includes(v["Severity"]))
    r.note = "High or Critical: make the area safe and tell your supervisor now. Saving this report also alerts the HSE lead.";
  return r;
}
function minsBetween(a, b) {
  if (!a || !b) return null;
  const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number);
  let d = (h2 * 60 + m2) - (h1 * 60 + m1); if (d < 0) d += 1440; return d;
}
/* fill a minutes box from its start/end times, unless the person typed their own figure */
function autoFill(form, v) {
  return; /* the brew sheet is filled exactly as on paper */
  current.auto = current.auto || {};
  const pairs = [["Run-off Time (mins)", "Run-off Start", "Run-off End"], ["Cool Time (mins)", "Cooling Start", "Cool End"], ["Pump to Whirlpool (mins)", "Pump to Whirlpool Start", "Pump to Whirlpool End"]];
  for (const [tgt, a, b] of pairs) {
    const m = minsBetween(v[a], v[b]);
    if (m == null) continue;
    if (v[tgt] === "" || v[tgt] == null || current.auto[tgt] === v[tgt]) {
      v[tgt] = String(m); current.auto[tgt] = v[tgt];
      const w = document.querySelector(`[data-name="${tgt}"] input`); if (w && w !== document.activeElement) w.value = v[tgt];
    }
  }
}
function calcs(form, v) {
  const n = k => { const x = parseFloat(v[k]); return isFinite(x) ? x : null; };
  const f1 = (x, d = 2) => x == null || !isFinite(x) ? "–" : x.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = x => x == null || !isFinite(x) ? "–" : (x * 100).toFixed(1) + "%";
  if (form.key === "packaging") {
    const p = n("Planned Time (min)"), c = n("Cases Bottled"), d = n("Downtime (min)") ?? 0, rated = form.rated[v["Line"]];
    return [["Run time (min)", p == null ? "–" : f1(p - d, 0)], ["Rated speed", rated ? rated.toLocaleString() + "/hr" : "–"],
            ["Efficiency", p && c != null && rated ? pct(c / (p / 60 * rated)) : "–"]];
  }
  if (form.key === "brewing") return null;
  if (false) {
    const ko = n("Kettle Out (°P)"), boil = ["Boil Init (mins)", "Boil Final (mins)", "Boil Extra (mins)"].map(n);
    const tot = boil.some(x => x != null) ? boil.reduce((a, b) => a + (b || 0), 0) : null;
    const ro = minsBetween(v["Run-off Start"], v["Run-off End"]), cool = minsBetween(v["Cooling Start"], v["Cool End"]);
    return [["Run-off (mins)", ro == null ? "–" : String(ro)], ["Boil total (mins)", tot == null ? "–" : String(tot)],
            ["Cool time (mins)", cool == null ? "–" : String(cool)],
            ["Kettle out vs 16.9–17.2 °P", ko == null ? "–" : ko.toFixed(2) + (ko >= 16.9 && ko <= 17.2 ? " ✓" : " ✕")]];
  }
  if (form.key === "facilities") {
    const hl = n("Beer Produced (hl)"), per = k => hl ? n(k) / hl : null;
    return [["kWh per hl", f1(per("Electricity (kWh)"))], ["Water hl/hl", f1(hl ? n("Water (m³)") * 10 / hl : null)],
            ["Fuel L/hl", f1(per("Fuel (litres)"))], ["CO2 kg/hl", f1(per("CO2 (kg)"))]];
  }
  if (form.key === "operations") {
    const p = n("Planned Cases"), a = n("Actual Cases"), c = n("Production Cost (XCD)");
    return [["Variance (cases)", p != null && a != null ? (a - p).toLocaleString() : "–"], ["Plan attainment", p && a != null ? pct(a / p) : "–"],
            ["Cost per case (XCD)", a && c != null ? f1(c / a) : "–"]];
  }
  return null;
}

  Object.assign(vals, r.force);
  const c = calcs(form, vals);
  const scroll = window.scrollY, active = document.activeElement && document.activeElement.id;
  const reqCount = form.all.filter(f => f.req).length;
  const sheet = form.fields.some(x => x.type === "section");
  if (sheet) {
    $("#app").innerHTML = `
    ${current.editId ? `<div class="editnote">Editing an entry saved on ${esc(current.editAt)} that hasn't been sent yet. Save changes to keep it in the queue, or go back to leave it as it was.</div>` : ""}
    ${errors._form ? `<div class="err" role="alert">${esc(errors._form)}</div>` : ""}
    <div class="sec">${esc(form.dept)}</div>
    <section class="panel">
      <h2>${esc(form.title)}</h2><p class="hint">${esc(form.desc)}</p>
      <form id="theForm" class="sheetform" novalidate>${sheetBody(form, vals, r, errors)}</form>
    </section>`;
  } else $("#app").innerHTML = `
    ${current.editId ? `<div class="editnote">Editing an entry saved on ${esc(current.editAt)} that hasn't been sent yet. Save changes to keep it in the queue, or go back to leave it as it was.</div>` : ""}
    ${errors._form ? `<div class="err" role="alert">${esc(errors._form)}</div>` : ""}
    <div class="sec">${esc(form.dept)}</div>
    <div class="grid">
      <section class="panel s8">
        <h2>${esc(form.title)}</h2><p class="hint">${form.all.length} questions · ${reqCount} required${form.fields.some(x => x.type === "section") ? " · fill in as the brew goes; your entries are kept on this device until you save" : ""}</p>
        <form id="theForm" novalidate>
          ${form.fields.map((f, i) => fieldHTML(f, i, vals, r, errors[f.name])).join("")}
          <div class="rule" id="ruleNote" role="alert" ${r.note ? "" : "hidden"}>${esc(r.note || "")}</div>
        </form>
      </section>
      <aside class="s4 stick">
        ${c ? `<div class="kpis calc" aria-label="Worked out automatically">${c.map(([k, x]) => `<div class="tile"><div class="tl">${esc(k)}</div><div class="tv">${esc(x)}</div></div>`).join("")}</div>` : ""}
        <div class="panel" style="${c ? "margin-top:10px" : ""}">
          <h2>What happens when you save</h2><p class="hint">${esc(tableName(form.key, current.vals) || "Tracker")}</p>
          <ul class="side-list">
            <li><span class="pill n">Pending</span> The entry is added as a new row</li>
            <li><span class="pill g">Verified</span> A data clerk checks it, then it reaches the dashboards</li>
            <li><span class="pill a">Offline</span> No signal? It's kept on this device and sent automatically later</li>
          </ul>
        </div>
      </aside>
    </div>`;
  const formEl = $("#theForm");
  formEl.addEventListener("input", onInput);
  formEl.addEventListener("change", onInput);
  formEl.addEventListener("submit", e => { e.preventDefault(); submit(); });
  if (active && document.getElementById(active)) { const el = document.getElementById(active); el.focus({ preventScroll: true }); }
  window.scrollTo(0, scroll);
}

function onInput(e) {
  const t = e.target, wrap = t.closest("[data-name]");
  if (!wrap) return;
  const name = wrap.dataset.name, f = current.form.all.find(x => x.name === name);
  current.vals[name] = t.type === "checkbox" ? (t.checked ? "Yes" : "") : t.value;
  if (current.auto) delete current.auto[name];
  if (NAME_FIELDS.test(name) && f.type === "text" && !/No\./.test(name) && t.value.trim()) store.set("cbg.name", t.value.trim());
  if (current.errors[name]) { delete current.errors[name]; wrap.classList.remove("bad"); const m = wrap.querySelector(".msg"); if (m) m.remove(); }
  applyRules();
  store.set("cbg.draft." + current.form.key, current.vals);
}
/* update visibility, allowed options, notices and calculations in place (no re-render, so taps aren't lost) */
function applyRules() {
  const { form, vals } = current, r = rules(form.key, vals);
  Object.assign(vals, r.force);
  autoFill(form, vals);
  document.querySelectorAll("#theForm [data-name]").forEach(w => {
    const n = w.dataset.name, ex = r.exclude[n] || [];
    w.hidden = r.hide.has(n);
    w.querySelectorAll("option").forEach(o => { if (o.value) o.hidden = ex.includes(o.value); });
    w.querySelectorAll('input[type="radio"]').forEach(i => { i.closest("label").hidden = ex.includes(i.value); });
    const sel = w.querySelector("select");
    if (sel && !w.hidden && ex.includes(sel.value)) { sel.value = ""; vals[n] = ""; }
    if (sel && w.hidden && n in r.force) sel.value = r.force[n];
  });
  const note = $("#ruleNote"); if (note) { note.hidden = !r.note; note.textContent = r.note || ""; }
  brandify();
  const c = calcs(form, vals), box = $(".calc");
  if (c && box) box.innerHTML = c.map(([k, x]) => `<div class="tile"><div class="tl">${esc(k)}</div><div class="tv">${esc(x)}</div></div>`).join("");
}
/* Brewing: show the chosen brand's standards, log column letters, brew number prefix and tracker */
function brandify() {
  if (!current) return;
  const J = s => { try { return JSON.parse(s); } catch (e) { return {}; } }, b = curBrand();
  document.querySelectorAll("#theForm [data-stdb]").forEach(e => { e.textContent = J(e.dataset.stdb)[b] || ""; });
  document.querySelectorAll("#theForm [data-hintb]").forEach(e => { e.textContent = J(e.dataset.hintb)[b] || ""; });
  document.querySelectorAll("#theForm [data-colb]").forEach(e => { const t = J(e.dataset.colb)[b] || ""; e.textContent = t; e.hidden = !t; });
  document.querySelectorAll("#theForm [data-unitb]").forEach(e => { const t = J(e.dataset.unitb)[b] || ""; e.placeholder = t ? "e.g. " + t + "123" : ""; });
  document.querySelectorAll("#theForm [data-noteb]").forEach(e => { e.textContent = J(e.dataset.noteb)[b] || e.dataset.def || ""; });
  const k = current.form.key, chip = $("#fbChip"), sb = $("#sbTable");
  if (chip) chip.innerHTML = `<i></i>${esc(fileName(k, current.vals))} <em>${esc(tableName(k, current.vals))}</em>`;
  if (sb) sb.textContent = tableName(k, current.vals) || "the tracker";
}
function validate() {
  const { form, vals } = current, r = rules(form.key, vals), errs = {};
  for (const f of form.all) {
    if (r.hide.has(f.name)) continue;
    const v = String(vals[f.name] ?? "").trim(), required = f.req || r.req[f.name];
    if (required && !v) { errs[f.name] = f.type === "choice" ? "Choose one." : "Fill this in."; continue; }
    if (v && f.type === "number" && !(isFinite(Number(v)) && (f.neg || Number(v) >= 0))) errs[f.name] = f.neg ? "Enter a number." : "Enter a number of 0 or more.";
    if (v && f.type === "choice" && (r.exclude[f.name] || []).includes(v)) errs[f.name] = "Choose a different option.";
  }
  return errs;
}

async function submit() {
  const btn = $("#saveBtn");
  current.errors = validate();
  if (Object.keys(current.errors).length) {
    renderForm();
    const first = $(".fld.bad input, .fld.bad select, .fld.bad textarea"); if (first) first.focus();
    return;
  }
  const { form, vals } = current;
  const now = new Date();
  const values = {};
  for (const f of form.all) {
    let v = String(vals[f.name] ?? "").trim();
    values[f.name] = v === "" ? null : f.type === "number" ? Number(v) : v;
  }
  const edit = current.editId && store.get("cbg.queue", []).some(e => e.id === current.editId) ? current.editId : null;
  const entry = edit ? { id: edit, form: form.key, submittedAt: current.editAt, submittedBy: current.editBy, values } : {
    id: "WEB-" + isoDate(now).replace(/-/g, "") + "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds()) + "-" + Math.random().toString(36).slice(2, 5).toUpperCase(),
    form: form.key, submittedAt: stamp(now), submittedBy: (account && account.username) || store.get("cbg.name", "") || "Unknown", values
  };
  btn.disabled = true; btn.textContent = "Saving…";
  if (edit) dropQueued(edit);
  let status;
  try { await send(entry); status = CFG.mode === "demo" ? "Demo" : "Sent"; }
  catch (e) {
    if (e.retry) { queue(entry); status = "Queued"; }
    else { btn.disabled = false; btn.textContent = "Save entry"; current.errors = { _form: e.message || "Could not save. Try again." }; renderForm(); window.scrollTo(0, 0); return; }
  }
  record(entry, status);
  if (!current.editId) store.set("cbg.draft." + form.key, {});
  current = null;
  viewDone(entry, status, form);
}
function viewDone(entry, status, form) {
  setSavebar("");
  chrome(form.key, [deptCrumb(form.dept), form.title, "Saved"], `${esc(form.dept)} <span class="dot"></span> ${esc(longDate())}`, demoChip(), nameCtl());
  const q = status === "Queued";
  $("#app").innerHTML = `
    <div class="panel done ${q ? "q" : ""}">
      <div class="tick" aria-hidden="true">${q ? "!" : "✓"}</div>
      <h2>${q ? "Saved on this device" : status === "Demo" ? "Saved (demo)" : "Entry saved"}</h2>
      <p>${q ? "No connection to SharePoint right now. It will send automatically when the connection returns; keep this page open or reopen it later." :
        status === "Demo" ? "In live mode this would now be a Pending row in the " + esc(form.dept) + " tracker." :
        "Added to the " + esc(form.dept) + " tracker as Pending. A data clerk will check it."}</p>
      <span class="rid">${esc(entry.id)}</span>
      <div class="btns"><a class="pbtn" href="#f-${form.key}" id="again">Record another</a>${deptForms(form.dept).length > 1 ? `<a class="obtn" href="#d-${slug(form.dept)}">${esc(form.dept)}</a>` : ""}<a class="obtn" href="#home">Overview</a></div>
    </div>`;
  $("#again").addEventListener("click", e => { if (location.hash === "#f-" + form.key) { e.preventDefault(); route(); } });
  $("#again").focus();
}
/* ---------- entries log & offline queue ---------- */
function record(entry, status) {
  const list = store.get("cbg.entries", []).filter(e => e.id !== entry.id);
  list.unshift(Object.assign({}, entry, { status }));
  store.set("cbg.entries", list.slice(0, 50));
}
function queue(entry) { const q = store.get("cbg.queue", []); q.push(entry); store.set("cbg.queue", q); showQueue(); }
function showQueue() {
  const n = store.get("cbg.queue", []).length, b = $("#queueBadge");
  b.hidden = !n; b.textContent = n + " waiting to send"; b.title = "Edit or delete on the Overview page";
  if (!b.dataset.wired) { b.dataset.wired = "1"; b.style.cursor = "pointer"; b.addEventListener("click", () => { location.hash = "#home"; setTimeout(() => { const el = $("#queue"); if (el) el.scrollIntoView({ behavior: "smooth" }); }, 50); }); }
  if ((location.hash || "#home") === "#home" && !current) { /* keep home tiles current */ }
}
let flushing = false;
async function flush() {
  if (flushing || CFG.mode === "demo") return;
  flushing = true;
  let q = store.get("cbg.queue", []);
  const left = [];
  for (const e of q) {
    if (current && current.editId === e.id) { left.push(e); continue; }
    try { await send(e); record(e, "Sent"); } catch (err) { left.push(e); if (err.retry === false) break; }
  }
  store.set("cbg.queue", left); flushing = false; showQueue();
}

/* ---------- sending ---------- */
function httpError(status, text) {
  const e = new Error();
  e.status = status;
  e.retry = [0, 408, 409, 423, 429, 500, 502, 503, 504].includes(status);
  e.message = status === 401 || status === 403 ? "You don't have permission to add to this tracker. Ask the site owner to give you edit access, then try again." :
    status === 404 ? "The tracker file or table wasn't found. The site owner needs to check config.js." :
    e.retry ? "SharePoint is busy or unreachable." : "Could not save (" + status + "). " + (text || "");
  return e;
}
async function send(entry) {
  if (CFG.mode === "demo") return new Promise(r => setTimeout(r, 500));
  const fc = target(entry.form, entry.values);
  if (fc.brands) { const e = httpError(404); e.retry = false; e.message = "Choose the brand first, so the entry goes to that brand's tracker."; throw e; }
  if (CFG.mode === "flow") {
    const url = fc.flowUrl || CFG.flowUrl;
    if (!url) throw httpError(404);
    let res;
    try {
      res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ form: entry.form, file: "/" + (fc.file || ""), table: fc.table || "", responseId: entry.id, submittedAt: entry.submittedAt, submittedBy: entry.submittedBy,
          row: Object.assign({ "Response ID": entry.id, "Submitted At": entry.submittedAt, "Submitted By": entry.submittedBy, "Status": "Pending" }, entry.values), values: entry.values }) });
    } catch (e) { throw httpError(0); }
    if (!res.ok) throw httpError(res.status, await res.text().catch(() => ""));
    return;
  }
  if (CFG.mode === "graph") return graphAddRow(fc, entry);
  throw new Error("Unknown mode in config.js: " + CFG.mode);
}

/* Microsoft Graph: add a row to the Excel table on the SharePoint site, matched by column name */
let pca = null, account = null;
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Could not load sign-in library.")); document.head.appendChild(s); }); }
async function msalInit() {
  if (pca) return;
  await loadScript(MSAL_URL);
  pca = new msal.PublicClientApplication({
    auth: { clientId: CFG.clientId, authority: "https://login.microsoftonline.com/" + CFG.tenantId, redirectUri: CFG.redirectUri || location.origin + location.pathname },
    cache: { cacheLocation: "localStorage" }
  });
  const res = await pca.handleRedirectPromise();
  account = (res && res.account) || pca.getAllAccounts()[0] || null;
}
async function signIn() { await msalInit(); await pca.loginRedirect({ scopes: SCOPES }); }
async function token() {
  await msalInit();
  if (!account) { const e = httpError(401); e.retry = false; e.message = "Sign in with your CBG account first (home page)."; throw e; }
  try { return (await pca.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch (e) { await pca.acquireTokenRedirect({ scopes: SCOPES, account }); }
}
async function g(path, opt = {}) {
  const t = await token();
  let res;
  try { res = await fetch(GRAPH + path, Object.assign({}, opt, { headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" } })); }
  catch (e) { throw httpError(0); }
  if (!res.ok) throw httpError(res.status, await res.text().catch(() => ""));
  return res.json();
}
const headerCache = {};
async function graphAddRow(fc, entry) {
  let siteId = store.get("cbg.siteId", null);
  if (!siteId) { siteId = (await g(`/sites/${CFG.siteHostname}:${CFG.sitePath}`)).id; store.set("cbg.siteId", siteId); }
  const path = fc.file.split("/").map(encodeURIComponent).join("/");
  const base = `/sites/${siteId}/drive/root:/${path}:/workbook/tables/${encodeURIComponent(fc.table)}`;
  if (!headerCache[fc.table]) headerCache[fc.table] = (await g(base + "/headerRowRange")).values[0];
  const sys = { "Response ID": entry.id, "Submitted At": entry.submittedAt, "Submitted By": entry.submittedBy, "Status": "Pending" };
  const row = headerCache[fc.table].map(h => h in sys ? sys[h] : h in entry.values ? entry.values[h] : null);
  await g(base + "/rows/add", { method: "POST", body: JSON.stringify({ values: [row] }) });
}

/* ---------- router & start ---------- */
function route() {
  const h = location.hash.replace("#", "");
  if (h.startsWith("f-")) viewForm(h.slice(2));
  else if (h.startsWith("d-")) { current = null; viewDept(h.slice(2)); }
  else { current = null; viewHome(); }
  if (!h.startsWith("f-")) window.scrollTo(0, 0);
}
async function start() {
  $("#signinTop").addEventListener("click", () => signIn());
  $("#railTog").addEventListener("click", () => document.body.classList.toggle("rail-open"));
  $("#rail").addEventListener("click", e => { if (e.target.closest("a")) document.body.classList.remove("rail-open"); });
  const tb = $("#themeBtn"), curT = () => document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  tb.addEventListener("click", () => { const n = curT() === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem("cbg-theme", n); } catch (e) {} });
  showQueue();
  if (CFG.mode === "graph") { try { await msalInit(); } catch (e) { console.warn(e); } }
  updStatus();
  window.addEventListener("hashchange", () => { if (!location.hash.startsWith("#f-")) current = null; route(); });
  window.addEventListener("online", flush);
  setInterval(flush, 60000);
  route();
  flush();
}
start();
</script>
